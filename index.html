<style>
/* Layout: one centered stack — avatar, name, two icon links */
:root {
  --bg: #f3f4f6;
  --fg: #16181d;
  --dim: #6b7080;
  --avatar-bg: #dfe3ea;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #131418; --fg: #eceef2; --dim: #8d93a3; --avatar-bg: #262931; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #131418; --fg: #eceef2; --dim: #8d93a3; --avatar-bg: #262931; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
.page { min-height: 100%; display: grid; place-items: center; padding-inline: 16px; padding-block: 48px; box-sizing: border-box; }
.stack { display: grid; justify-items: center; gap: 20px; }
.avatar { width: 112px; height: 112px; border-radius: 50%; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 8vw, 42px); letter-spacing: -.01em; margin: 0; text-align: center; }
.bio { margin: -6px 0 0; max-width: 34ch; text-align: center; color: var(--dim); font-size: 16px; line-height: 1.55; }
.bio a { color: var(--fg); text-decoration: underline; text-decoration-color: var(--dim); text-underline-offset: 3px; }
.bio a:hover { text-decoration-color: var(--fg); }
.w3c { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; color: var(--dim); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.w3c:hover { color: var(--fg); }
.links { display: flex; gap: 22px; }
.links a { color: var(--dim); display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; transition: color .15s; }
.links a:hover { color: var(--fg); }
.links a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.links svg { width: 26px; height: 26px; fill: currentColor; }
@media (prefers-reduced-motion: reduce) { .links a { transition: none; } }
</style>
